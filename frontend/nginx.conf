# The SPA and the API on one origin: no CORS, no cookie crossing hosts.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        # The backend trusts this header only from a private address (TRUST_PROXY),
        # which is how the per-IP rate limits see the visitor and not nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        # The backend's helmet sends these three too, with the same values;
        # the server{} copies above are the ones that leave, once each.
        # proxy_hide_header is not add_header, so the inherited headers stay.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # No add_header below this line: one inside a location drops every
    # add_header inherited from server{}, security headers included (RULES.md §6).
    # `expires` sets Cache-Control without that side effect.

    location /assets/ {
        # Vite fingerprints every file here, so it can be cached for good.
        expires 1y;
        try_files $uri =404;
    }

    # A client-side route (/account, /login…) is index.html; the router takes it from there.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
